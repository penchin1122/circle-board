<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>明治就活サークル 運営ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="運営ボード">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <img class="logo" src="logo-mark.png" alt="" width="48" height="35">
      <div>
        <h1><span class="hide-sm">明治</span>就活サークル 運営ボード</h1>
        <p class="sub">MEIJI SYUUKATSU CIRCLE ／ STAFF ONLY</p>
      </div>
      <div class="mast-tools" id="mast-tools"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="sk-wrap" role="status" aria-label="読み込み中">
    <div class="bar"><span class="sk" style="width:8em;height:24px"></span></div>
    <div class="grid2"><section class="panel"><span class="sk" style="width:40%;height:16px"></span><div style="margin-top:14px"><span class="sk" style="width:90%;height:14px"></span><span class="sk" style="width:70%;height:14px;margin-top:10px"></span><span class="sk" style="width:80%;height:14px;margin-top:10px"></span></div></section>
    <section class="panel"><span class="sk" style="width:35%;height:16px"></span><div style="margin-top:14px"><span class="sk" style="width:100%;height:10px"></span><span class="sk" style="width:100%;height:10px;margin-top:22px"></span><span class="sk" style="width:100%;height:10px;margin-top:22px"></span></div></section></div>
  </div>
</main>
<dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
