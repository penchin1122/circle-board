<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>明治就活サークル 運営ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<link rel="stylesheet" href="styles.css?v=20261023c">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="運営ボード">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="メニューを開く" aria-controls="drawer" aria-expanded="false" hidden><span></span><span></span><span></span></button>
      <img class="logo" src="logo-mark.png" alt="" width="48" height="35">
      <div>
        <h1 id="page-title">運営ボード</h1>
      </div>
      <div class="mast-tools" id="mast-tools"></div>
    </div>
  </div>
</header>
<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer" aria-label="メニュー" inert>
  <div class="drawer-head"><img src="logo-mark.png" alt="" width="34" height="25"><b>運営ボード</b><button class="drawer-x" type="button" data-menu="close" aria-label="メニューを閉じる">×</button></div>
  <nav class="drawer-nav" id="tabs" aria-label="ページ"></nav>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>
<main class="wrap" id="main">
  <div class="sk-wrap" role="status" aria-label="読み込み中">
    <div class="bar"><span class="sk" style="width:8em;height:24px"></span></div>
    <div class="grid2"><section class="panel"><span class="sk" style="width:40%;height:16px"></span><div style="margin-top:14px"><span class="sk" style="width:90%;height:14px"></span><span class="sk" style="width:70%;height:14px;margin-top:10px"></span><span class="sk" style="width:80%;height:14px;margin-top:10px"></span></div></section>
    <section class="panel"><span class="sk" style="width:35%;height:16px"></span><div style="margin-top:14px"><span class="sk" style="width:100%;height:10px"></span><span class="sk" style="width:100%;height:10px;margin-top:22px"></span><span class="sk" style="width:100%;height:10px;margin-top:22px"></span></div></section></div>
  </div>
</main>
<dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="app.js?v=20261023c"></script>
</body>
</html>
