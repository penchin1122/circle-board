name: 朝の通知

on:
  schedule:
    # 5分ごと（終日）。議事録のまとめもこの中で行う。朝の通知は設定タブの時刻を過ぎた最初の回で1日1回だけ、
    # 未対応事項の通知は追加されたものがあるときだけ送る（夜23時〜朝7時は朝まで待つ）
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "管理者の端末にだけテスト通知を送る"
        type: boolean
        default: true
      force:
        description: "時刻に関係なく、今日の担当者全員に今すぐ送る"
        type: boolean
        default: false
      dry_run:
        description: "実際には送らず、送る内容だけ表示する"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          ADMIN_EMAIL: satoakira.20060214@gmail.com
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
